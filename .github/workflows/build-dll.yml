name: build-wayfarer

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'

env:
  VCPKG_ROOT: ${{ github.workspace }}\vcpkg

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vcpkg-configuration.json pins the builtin registry to a historical
      # commit (d87340...), so a shallow clone is unusable: vcpkg has to run
      # `git show <baseline>:versions/baseline.json` and that commit must
      # exist in local history. Full clone, then verify, then fetch if needed.
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }

          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & "$env:VCPKG_ROOT\vcpkg.exe" version

          $config = Get-Content -LiteralPath "vcpkg-configuration.json" -Raw | ConvertFrom-Json
          # Only the builtin default registry lives inside this vcpkg clone.
          # Extra git registries (e.g. the colorglass one) are cached and
          # fetched by vcpkg itself, so they must not be checked here.
          $builtin = $config.'default-registry'
          if ($builtin -and $builtin.kind -eq 'builtin' -and $builtin.baseline) {
            $baseline = $builtin.baseline
            git -C "$env:VCPKG_ROOT" cat-file -e "$baseline^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              Write-Host "fetching builtin baseline $baseline"
              git -C "$env:VCPKG_ROOT" fetch --depth 1 origin $baseline
              git -C "$env:VCPKG_ROOT" cat-file -e "$baseline^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) { throw "builtin baseline commit $baseline is not reachable" }
            }
            Write-Host "builtin baseline present: $baseline"
          }

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md-

      - name: Install manifest dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static-md --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      # The runner ships a newer Visual Studio than the "Visual Studio 17 2022"
      # generator hard-coded in CMakePresets.json (VS 18 / MSVC 14.52 in the
      # current image), so the generator name is matched to whatever CMake can
      # actually see. If no Visual Studio generator exists at all, fall back to
      # Ninja with the MSVC environment injected.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          $common = @(
            "-DBUILD_SKYRIM=ON",
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed",
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static-md",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          )
          $help = (cmake --help) -join "`n"
          $generators = [regex]::Matches($help, 'Visual Studio ([0-9]+ [0-9]{4})') |
            ForEach-Object { "Visual Studio " + $_.Groups[1].Value }
          $configured = $false
          foreach ($g in $generators) {
            Write-Host "trying generator: $g"
            cmake -S . -B build/ci -G $g -A x64 @common
            if ($LASTEXITCODE -eq 0) {
              Write-Host "configured with $g"
              "MULTI=1" | Out-File -FilePath $env:GITHUB_ENV -Append
              $configured = $true
              break
            }
            Remove-Item -LiteralPath build/ci -Recurse -Force -ErrorAction SilentlyContinue
          }
          if (-not $configured) {
            Write-Host "no Visual Studio generator usable; falling back to Ninja"
            cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release @common
            if ($LASTEXITCODE -ne 0) { throw "CMake configure failed with every generator" }
            "MULTI=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Release
        shell: pwsh
        run: |
          if ($env:MULTI -eq "1") {
            cmake --build build/ci --config Release --parallel
          }
          else {
            cmake --build build/ci --parallel
          }
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Test (non-blocking)
        shell: pwsh
        continue-on-error: true
        run: |
          if ($env:MULTI -eq "1") { ctest --test-dir build/ci -C Release --output-on-failure }
          else { ctest --test-dir build/ci --output-on-failure }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: Wayfarer-dll
          path: |
            build/ci/bin/**/Wayfarer.dll
            build/ci/bin/**/Wayfarer.pdb
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter Wayfarer.dll -Recurse | Select-Object -First 1
          if ($dll) {
            "Built: $($dll.FullName) ($([math]::Round($dll.Length/1KB,1)) KB)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
